<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- 角（ビクッと上向き） -->
  <path d="M9,5 Q5,0 2,1 Q5,3 8,6" fill="#c8a060" stroke="#a08040" stroke-width="0.4"/>
  <path d="M23,5 Q27,0 30,1 Q27,3 24,6" fill="#c8a060" stroke="#a08040" stroke-width="0.4"/>
  <!-- 耳（水平・驚いて少し上がり気味） -->
  <ellipse cx="4"  cy="11" rx="4.5" ry="3"   fill="#c8a060"/>
  <ellipse cx="4"  cy="11" rx="2.8" ry="1.8" fill="#f0b090"/>
  <ellipse cx="28" cy="11" rx="4.5" ry="3"   fill="#c8a060"/>
  <ellipse cx="28" cy="11" rx="2.8" ry="1.8" fill="#f0b090"/>
  <!-- 頭（縦長） -->
  <ellipse cx="16" cy="17" rx="10.5" ry="14" fill="#f5f0e8" stroke="#d0c8b8" stroke-width="0.4"/>
  <!-- ホルスタイン黒模様 -->
  <ellipse cx="10" cy="10" rx="3.5" ry="3" fill="#2a2a2a" opacity="0.85"/>
  <!-- 目（×形・驚き） -->
  <line x1="9"  y1="12" x2="13" y2="16" stroke="#3a1a04" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="13" y1="12" x2="9"  y2="16" stroke="#3a1a04" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="19" y1="12" x2="23" y2="16" stroke="#3a1a04" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="23" y1="12" x2="19" y2="16" stroke="#3a1a04" stroke-width="1.6" stroke-linecap="round"/>
  <!-- 鼻面 -->
  <ellipse cx="16" cy="25.5" rx="7.5" ry="5.5" fill="#f0c0a8" stroke="#d09080" stroke-width="0.4"/>
  <!-- 鼻孔 -->
  <ellipse cx="12.5" cy="26"  rx="1.5" ry="1.2" fill="#c07060"/>
  <ellipse cx="19.5" cy="26"  rx="1.5" ry="1.2" fill="#c07060"/>
  <!-- 困り口 -->
  <path d="M13,28.5 Q14.5,27 16,28 Q17.5,29 19,28.5" fill="none" stroke="#a06050" stroke-width="0.9" stroke-linecap="round"/>
  <!-- 汗 -->
  <ellipse cx="4"  cy="14" rx="1.1" ry="1.7" fill="#88c0e8" opacity="0.85"/>
  <ellipse cx="28" cy="13" rx="1.1" ry="1.7" fill="#88c0e8" opacity="0.85"/>
  <!-- ★ -->
  <text x="2"  y="9"   font-size="4.5" fill="#f8c000" opacity="0.9">★</text>
  <text x="25" y="7"   font-size="3.5" fill="#f8c000" opacity="0.85">★</text>
  <text x="14" y="4.5" font-size="3"   fill="#f8c000" opacity="0.75">✦</text>
</svg>
