  <!-- ひげ 左 -->
  <line x1="1"  y1="20.5" x2="11" y2="21.5" stroke="#5868a0" stroke-width="0.7" opacity="0.75"/>
  <line x1="1"  y1="23.2" x2="11" y2="22.5" stroke="#5868a0" stroke-width="0.7" opacity="0.75"/>
  <!-- ひげ 右 -->
  <line x1="21" y1="21.5" x2="31" y2="20.5" stroke="#5868a0" stroke-width="0.7" opacity="0.75"/>
  <line x1="21" y1="22.5" x2="31" y2="23.2" stroke="#5868a0" stroke-width="0.7" opacity="0.75"/>
