  <circle cx="16" cy="19" r="12.5" fill="none" stroke="#6070a0" stroke-width="0.6"/>
  <!-- 左目 -->
  <ellipse cx="11.5" cy="17.5" rx="2.8" ry="2.8" fill="#1a1830"/>
  <circle cx="12.4" cy="16.3" r="0.9" fill="#fff"/>
  <!-- 右目 -->
