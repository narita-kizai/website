<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- 角（ビクッと上向き） -->
  <path d="M10,5 Q7,0 4,1 Q6,3 9,6" fill="#c8a060" stroke="#a08040" stroke-width="0.4"/>
  <path d="M22,5 Q25,0 28,1 Q26,3 23,6" fill="#c8a060" stroke="#a08040" stroke-width="0.4"/>
  <!-- 耳（驚いて上がり気味） -->
  <circle cx="5.5"  cy="11" r="5.5" fill="#c8a060"/>
  <circle cx="5.5"  cy="11" r="3.5" fill="#f0b090"/>
  <circle cx="26.5" cy="11" r="5.5" fill="#c8a060"/>
  <circle cx="26.5" cy="11" r="3.5" fill="#f0b090"/>
  <!-- 頭 -->
  <ellipse cx="16" cy="21" rx="12.5" ry="10.5" fill="#f5f0e8" stroke="#d0c8b8" stroke-width="0.4"/>
  <!-- ホルスタイン模様 -->
  <ellipse cx="10" cy="16" rx="4" ry="3.5" fill="#2a2a2a" opacity="0.85"/>
  <!-- 目（×形・驚き） -->
  <line x1="9"    y1="17"   x2="13"   y2="21"   stroke="#3a1a04" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="13"   y1="17"   x2="9"    y2="21"   stroke="#3a1a04" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="19"   y1="17"   x2="23"   y2="21"   stroke="#3a1a04" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="23"   y1="17"   x2="19"   y2="21"   stroke="#3a1a04" stroke-width="1.6" stroke-linecap="round"/>
  <!-- 鼻面 -->
  <ellipse cx="16" cy="25" rx="6"   ry="4"   fill="#f0c0a8" stroke="#d09080" stroke-width="0.4"/>
  <!-- 鼻孔 -->
  <ellipse cx="13.5" cy="25.5" rx="1.2" ry="0.9" fill="#c07060"/>
  <ellipse cx="18.5" cy="25.5" rx="1.2" ry="0.9" fill="#c07060"/>
  <!-- 困り口 -->
  <path d="M13,27.5 Q14.5,26 16,27 Q17.5,28 19,27.5" fill="none" stroke="#a06050" stroke-width="0.9" stroke-linecap="round"/>
  <!-- 汗 -->
  <ellipse cx="4"  cy="14" rx="1.1" ry="1.7" fill="#88c0e8" opacity="0.85"/>
  <ellipse cx="28" cy="13" rx="1.1" ry="1.7" fill="#88c0e8" opacity="0.85"/>
  <!-- ★ -->
  <text x="2"  y="9"   font-size="4.5" fill="#f8c000" opacity="0.9">★</text>
  <text x="25" y="7"   font-size="3.5" fill="#f8c000" opacity="0.85">★</text>
  <text x="14" y="4.5" font-size="3"   fill="#f8c000" opacity="0.75">✦</text>
</svg>
