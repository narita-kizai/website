<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- 角（左） -->
  <path d="M10,7 Q8,2 5,3 Q7,5 9,8" fill="#c8a060" stroke="#a08040" stroke-width="0.4"/>
  <!-- 角（右） -->
  <path d="M22,7 Q24,2 27,3 Q25,5 23,8" fill="#c8a060" stroke="#a08040" stroke-width="0.4"/>
  <!-- 耳（左） -->
  <circle cx="5.5"  cy="13" r="5.5" fill="#c8a060"/>
  <circle cx="5.5"  cy="13" r="3.5" fill="#f0b090"/>
  <!-- 耳（右） -->
  <circle cx="26.5" cy="13" r="5.5" fill="#c8a060"/>
  <circle cx="26.5" cy="13" r="3.5" fill="#f0b090"/>
  <!-- 頭（ホルスタイン白ベース） -->
  <ellipse cx="16" cy="21" rx="12.5" ry="10.5" fill="#f5f0e8" stroke="#d0c8b8" stroke-width="0.4"/>
  <!-- ホルスタイン模様 -->
  <ellipse cx="10"  cy="16"  rx="4"   ry="3.5" fill="#2a2a2a" opacity="0.85"/>
  <ellipse cx="22"  cy="14"  rx="2.5" ry="2"   fill="#2a2a2a" opacity="0.85"/>
  <!-- 目（左） -->
  <circle cx="11.5" cy="19"   r="2.5" fill="#1a1008"/>
  <circle cx="12.4" cy="17.8" r="0.8" fill="#fff"/>
  <!-- 目（右） -->
  <circle cx="20.5" cy="19"   r="2.5" fill="#1a1008"/>
  <circle cx="21.4" cy="17.8" r="0.8" fill="#fff"/>
  <!-- 鼻面（大きなピンク） -->
  <ellipse cx="16" cy="25" rx="6"   ry="4"   fill="#f0c0a8" stroke="#d09080" stroke-width="0.4"/>
  <!-- 鼻孔 -->
  <ellipse cx="13.5" cy="25.5" rx="1.2" ry="0.9" fill="#c07060"/>
  <ellipse cx="18.5" cy="25.5" rx="1.2" ry="0.9" fill="#c07060"/>
  <!-- 口 -->
  <path d="M13,27.2 Q16,29 19,27.2" fill="none" stroke="#a06050" stroke-width="0.8" stroke-linecap="round"/>
</svg>
