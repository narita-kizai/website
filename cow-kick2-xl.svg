<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="64" height="64">
  <!-- 尻尾 -->
  <path d="M27,12 Q30,7 28,5" fill="none" stroke="#3a3028" stroke-width="1.4" stroke-linecap="round"/>
  <circle cx="28" cy="5" r="1.5" fill="#3a3028"/>

  <!-- 胴体（ホルスタイン白） -->
  <ellipse cx="18" cy="17" rx="10" ry="6" fill="#f5f0e8" stroke="#d0c8b8" stroke-width="0.4"/>
  <!-- 黒い模様 -->
  <ellipse cx="14" cy="12.5" rx="4"   ry="3"   fill="#2a2a2a" opacity="0.85"/>
  <ellipse cx="24" cy="18"   rx="3"   ry="2.5" fill="#2a2a2a" opacity="0.85"/>

  <!-- 乳房 -->
  <ellipse cx="19" cy="23" rx="3.5" ry="1.8" fill="#f5d0c0" stroke="#e0b0a0" stroke-width="0.3"/>

  <!-- 首 -->
  <ellipse cx="9.5" cy="15.5" rx="2.8" ry="4.5" fill="#f0e8d8" stroke="#d0c8b8" stroke-width="0.3" transform="rotate(-15 9.5 15.5)"/>

  <!-- 頭（縦長・左向き） -->
  <ellipse cx="5.5" cy="13.5" rx="4.5" ry="6" fill="#f5f0e8" stroke="#d0c8b8" stroke-width="0.4"/>
  <!-- 頭の黒模様 -->
  <ellipse cx="4" cy="9" rx="2" ry="1.5" fill="#2a2a2a" opacity="0.8"/>
  <!-- 角 -->
  <path d="M4,8 Q2,3 0,4 Q2,6 3.5,8.5" fill="#c8a060" stroke="#a08040" stroke-width="0.3"/>
  <path d="M8,7.5 Q10,3 12,4 Q10,6 8.5,8" fill="#c8a060" stroke="#a08040" stroke-width="0.3"/>
  <!-- 耳（水平） -->
  <ellipse cx="1"  cy="12" rx="2.5" ry="1.8" fill="#c8a060" transform="rotate(-25 1 12)"/>
  <ellipse cx="11" cy="11" rx="2.5" ry="1.8" fill="#c8a060" transform="rotate(25 11 11)"/>
  <!-- 目 -->
  <circle cx="4.5" cy="12.5" r="1.5" fill="#1a1008"/>
  <circle cx="5"   cy="11.8" r="0.5" fill="#fff"/>
  <!-- 鼻面 -->
  <ellipse cx="4"  cy="18"  rx="3.5" ry="2.5" fill="#f0c0a8" stroke="#d09080" stroke-width="0.3"/>
  <ellipse cx="2.8" cy="18.5" rx="0.9" ry="0.7" fill="#c07060"/>
  <ellipse cx="5.2" cy="18.5" rx="0.9" ry="0.7" fill="#c07060"/>

  <!-- 前足（2本） -->
  <rect x="11" y="22" width="2.2" height="9"  rx="0.9" fill="#e8d8b8" stroke="#c0a878" stroke-width="0.3"/>
  <rect x="14" y="22" width="2.2" height="9"  rx="0.9" fill="#e8d8b8" stroke="#c0a878" stroke-width="0.3"/>
  <!-- 前足の蹄 -->
  <rect x="10.8" y="29.2" width="2.7" height="1.8" rx="0.7" fill="#252020"/>
  <rect x="13.8" y="29.2" width="2.7" height="1.8" rx="0.7" fill="#252020"/>

  <!-- 後ろ足（立ち） -->
  <rect x="23" y="22" width="2.2" height="9"  rx="0.9" fill="#e8d8b8" stroke="#c0a878" stroke-width="0.3"/>
  <rect x="23" y="29.2" width="2.7" height="1.8" rx="0.7" fill="#252020"/>

  <!-- 後ろ蹴り足（後上方へ力強く） -->
  <path d="M25,22 Q28,18 30,13" fill="none" stroke="#e8d8b8" stroke-width="3.2" stroke-linecap="round"/>
  <!-- 蹄（蹴り・黒） -->
  <ellipse cx="30" cy="12" rx="2.8" ry="1.6" fill="#252020" stroke="#1a1010" stroke-width="0.5" transform="rotate(-40 30 12)"/>
  <!-- 蹄の割れ目 -->
  <line x1="29.3" y1="10.8" x2="30.8" y2="13.2" stroke="#1a1010" stroke-width="0.9" stroke-linecap="round"/>
</svg>
