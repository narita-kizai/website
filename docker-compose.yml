services:
  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: db
      DB_NAME: narita_db
      DB_USER: narita
      DB_PASS: narita
    depends_on:
      db:
        condition: service_healthy
    restart: always

  db:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE:      narita_db
      MYSQL_USER:          narita
      MYSQL_PASSWORD:      narita
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - narita_db_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-unarita", "-pnarita"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: always

  phpmyadmin:
    image: phpmyadmin:latest
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: narita
      PMA_PASSWORD: narita
    depends_on:
      db:
        condition: service_healthy
    restart: always

volumes:
  narita_db_data:
