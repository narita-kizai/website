<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- 耳（ビクッと立ち気味） -->
  <circle cx="8"  cy="6.5" r="7.5" fill="#b07838"/>
  <circle cx="8"  cy="6.5" r="5"   fill="#e8b090"/>
  <circle cx="24" cy="6.5" r="7.5" fill="#b07838"/>
  <circle cx="24" cy="6.5" r="5"   fill="#e8b090"/>
  <!-- 頭 -->
  <ellipse cx="16" cy="21" rx="12" ry="10.5" fill="#c08040"/>
  <ellipse cx="16" cy="21" rx="12" ry="10.5" fill="none" stroke="#986030" stroke-width="0.5"/>
  <!-- 左目 ＞ 形 -->
  <line x1="9"  y1="16.5" x2="12" y2="19"   stroke="#3a1a04" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="12" y1="16.5" x2="9"  y2="19"   stroke="#3a1a04" stroke-width="1.6" stroke-linecap="round"/>
  <!-- 右目 ＜ 形 -->
  <line x1="20" y1="16.5" x2="23" y2="19"   stroke="#3a1a04" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="23" y1="16.5" x2="20" y2="19"   stroke="#3a1a04" stroke-width="1.6" stroke-linecap="round"/>
  <!-- 鼻 -->
  <ellipse cx="16" cy="22" rx="1.5" ry="1.0" fill="#c04060"/>
  <!-- ぎゅっとした口（やられた） -->
  <path d="M12.5,23.5 Q14,22 16,23 Q18,24 19.5,23" fill="none" stroke="#902040" stroke-width="1.1" stroke-linecap="round"/>
  <!-- 汗 -->
  <ellipse cx="5.5" cy="14" rx="1.1" ry="1.7" fill="#88c0e8" opacity="0.85"/>
  <ellipse cx="26.5" cy="13" rx="1.1" ry="1.7" fill="#88c0e8" opacity="0.85"/>
  <!-- やられた★ -->
  <text x="2"  y="9"  font-size="4.5" fill="#f8c000" opacity="0.9">★</text>
  <text x="25" y="7"  font-size="3.5" fill="#f8c000" opacity="0.85">★</text>
  <text x="14" y="4.5" font-size="3"  fill="#f8c000" opacity="0.75">✦</text>
</svg>
