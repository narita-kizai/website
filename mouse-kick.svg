<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="64" height="64">
  <!-- 右上から大きな足裏が降ってくる -->
  <!-- 足裏（楕円） -->
  <ellipse cx="23.5" cy="9" rx="8" ry="5.5" fill="#d09050" stroke="#906030" stroke-width="0.6" transform="rotate(-20 23.5 9)"/>
  <!-- 指4本（上側に並ぶ） -->
  <circle cx="17.5" cy="3.5" r="2.1" fill="#c07838" stroke="#906030" stroke-width="0.4"/>
  <circle cx="21"   cy="2.1" r="2"   fill="#c07838" stroke="#906030" stroke-width="0.4"/>
  <circle cx="24.5" cy="1.8" r="1.8" fill="#c07838" stroke="#906030" stroke-width="0.4"/>
  <circle cx="27.8" cy="3"   r="1.6" fill="#c07838" stroke="#906030" stroke-width="0.4"/>
  <!-- 速度線（左下方向に蹴り込む） -->
  <line x1="13.5" y1="8"  x2="6"  y2="5"  stroke="#ffcc00" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>
  <line x1="13.5" y1="11" x2="5"  y2="10" stroke="#ffcc00" stroke-width="1.2" stroke-linecap="round" opacity="0.75"/>
  <line x1="14"   y1="5"  x2="8"  y2="1"  stroke="#ffcc00" stroke-width="1"   stroke-linecap="round" opacity="0.6"/>

  <!-- ネズミの顔（下半分・怒り顔） -->
  <!-- 左耳 -->
  <circle cx="6"  cy="19" r="5.5" fill="#b07838"/>
  <circle cx="6"  cy="19" r="3.5" fill="#e8b090"/>
  <!-- 右耳 -->
  <circle cx="19" cy="19" r="5.5" fill="#b07838"/>
  <circle cx="19" cy="19" r="3.5" fill="#e8b090"/>
  <!-- 頭 -->
  <ellipse cx="12.5" cy="27" rx="10" ry="7.5" fill="#c08040"/>
  <!-- 怒り眉 左 -->
  <line x1="6.5"  y1="22.5" x2="11"  y2="23.8" stroke="#3a1a04" stroke-width="1.8" stroke-linecap="round"/>
  <!-- 怒り眉 右 -->
  <line x1="18.5" y1="22.5" x2="14"  y2="23.8" stroke="#3a1a04" stroke-width="1.8" stroke-linecap="round"/>
  <!-- 目 左 -->
  <circle cx="9"  cy="25" r="2"   fill="#1a1008"/>
  <circle cx="9.6" cy="24.1" r="0.65" fill="#fff"/>
  <!-- 目 右 -->
  <circle cx="16" cy="25" r="2"   fill="#1a1008"/>
  <circle cx="16.6" cy="24.1" r="0.65" fill="#fff"/>
  <!-- 鼻 -->
  <ellipse cx="12.5" cy="27" rx="1.4" ry="1" fill="#c04060"/>
  <!-- 口（力を込めた表情） -->
  <path d="M10,28.2 Q12.5,30.2 15,28.2" fill="none" stroke="#902040" stroke-width="1" stroke-linecap="round"/>
  <!-- ひげ -->
  <line x1="1"  y1="24.5" x2="7.5"  y2="25.5" stroke="#906028" stroke-width="0.6" opacity="0.7"/>
  <line x1="1"  y1="27"   x2="7.5"  y2="26.5" stroke="#906028" stroke-width="0.6" opacity="0.7"/>
  <line x1="17.5" y1="25.5" x2="24" y2="24.5" stroke="#906028" stroke-width="0.6" opacity="0.7"/>
  <line x1="17.5" y1="26.5" x2="24" y2="27"   stroke="#906028" stroke-width="0.6" opacity="0.7"/>
</svg>
